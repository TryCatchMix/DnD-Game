# Perfil dev: arranca sin configurar nada y habilita /api/dev/**.
# Lánzalo con:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
archivos:
  jwt:
    secret: ${ARCHIVOS_JWT_SECRET:desarrollo-local-clave-de-32-bytes-o-mas-no-usar-en-produccion}

logging:
  level:
    org.springframework.security: INFO
    com.trycatchmix.archivos: DEBUG
